[package]
name = "knowledge"
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "The knowledge engine: one binary that indexes, searches and links an Obsidian vault for coding agents"
repository = "https://github.com/atlasatakahraman/knowledge-skeleton"
publish = false

# Each crate is the owner's pick (spec D22, D23; Stage 4, 2026-11-22: ureq with rustls on ring and
# the OS trust store, htmd). checks/crates.txt lists the whole tree on CI's eight targets;
# checks/stage-3.sh fails on anything else. A new one is a question for the owner, never quiet.
[dependencies]
htmd = "0.6.0"
# default-features off: the default `cache` feature pulls hashlink, and nothing here needs a
# statement cache beyond rusqlite's own prepare. `bundled` compiles SQLite with FTS5 into the binary.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
