body:
  - type: markdown
    attributes:
      value: |
        Mark the reply that answered you, so the next person finds it.
        Write in English or any language the README is in.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `knowledge --version`.
      placeholder: knowledge 0.13.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      multiple: true
      options:
        - Claude Code
        - Claude desktop app
        - Codex
        - opencode
        - None (the CLI alone)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do, and what you tried.
    validations:
      required: true
